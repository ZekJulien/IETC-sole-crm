<form class="client-form" [class.client-form--individual]="!isCompany" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="client-form__section">
    <h4 class="client-form__section-title">{{ 'form.identity' | t }}</h4>
    <div class="client-form__row">
      <div class="client-form__field">
        <label class="field__label">{{ 'client.type' | t }}</label>
        <select class="field__input" formControlName="type">
          <option [value]="ClientType.COMPANY">{{ 'client.type.company' | t }}</option>
          <option [value]="ClientType.INDIVIDUAL">{{ 'client.type.individual' | t }}</option>
        </select>
      </div>
      @if (!isCompany) {
        <app-form-field [label]="'client.firstName' | t" [control]="form.get('firstName')" />
      }
    </div>
    <div class="client-form__row">
      <app-form-field
        [label]="(isCompany ? 'client.companyName' : 'client.lastName') | t"
        [control]="form.get('name')" />
    </div>
    <div class="client-form__row">
      <app-form-field [label]="'common.email' | t" type="email" [control]="form.get('email')" />
      <app-form-field [label]="'common.phone' | t" type="tel"   [control]="form.get('phone')" patternErrorKey="phone" />
    </div>
  </div>

  <div class="client-form__section">
    <h4 class="client-form__section-title">{{ 'form.address' | t }}</h4>
    <app-form-field [label]="'common.street'  | t" [control]="form.get('street')" />
    <div class="client-form__row">
      <app-form-field [label]="'common.zipCode' | t" [control]="form.get('zipCode')" patternErrorKey="postalCode" />
      <app-form-field [label]="'common.city'    | t" [control]="form.get('city')" />
    </div>
    <app-form-field [label]="'common.country' | t" [control]="form.get('country')" />
  </div>

  @if (isCompany) {
    <div class="client-form__section">
      <h4 class="client-form__section-title">{{ 'form.billing' | t }}</h4>
      <div class="client-form__row">
        <app-form-field [label]="'client.companyNumber' | t" [control]="form.get('companyNumber')" patternErrorKey="companyNumber" />
        <app-form-field [label]="'client.vatNumber'     | t" [control]="form.get('vatNumber')"     patternErrorKey="vatNumber" />
      </div>
      <app-form-field [label]="'client.peppolId' | t" [control]="form.get('peppolId')" patternErrorKey="peppolId" />
    </div>
  }

  <div class="client-form__section">
    <h4 class="client-form__section-title">{{ 'form.notes' | t }}</h4>
    <app-form-field [label]="''" type="textarea" [control]="form.get('notes')" />
  </div>

  @if (showActions()) {
    <app-form-actions [loading]="loading()" (cancelled)="cancelled.emit()" />
  }
</form>
