<div class="client-list" [class.client-list--table]="viewMode() === 'table'" [class.client-list--dragging]="dragging()" [style.--main-width.px]="mainWidth()">

  <section class="client-main">
    <app-client-list-panel
      [clients]="clientStore.clients()"
      [selectedId]="selectedClient()?.id ?? null"
      [loading]="clientStore.loading()"
      [(viewMode)]="viewMode"
      [(searchTerm)]="searchTerm"
      (select)="onSelect($event)"
      (search)="load($event)"
      (newClient)="onNew($event)" />
  </section>

  <div class="client-resizer"
       appResizableSplitter
       [resizableMin]="MAIN_WIDTH_MIN"
       [resizableMax]="MAIN_WIDTH_MAX"
       (widthChange)="onWidthChange($event)"
       (draggingChange)="onDraggingChange($event)"
       aria-hidden="true"></div>

  <section class="client-detail" [class.client-detail--form-mode]="isCreating() || !!selectedClient()">
    @if (isCreating()) {
      <app-client-create-panel
        [initialType]="newClientType()"
        [saving]="clientStore.saving()"
        (submitted)="onCreateSubmit($event)"
        (cancelled)="onCreateCancel()" />
    } @else if (selectedClient(); as client) {
      <app-client-detail-panel
        [client]="client"
        [contacts]="contactStore.contacts()"
        [saving]="clientStore.saving()"
        (save)="onEditSave($event)"
        (deleted)="onRemoveRequest($event)"
        (contactSubmit)="onContactSubmit($event)"
        (contactRemove)="onContactRemove($event)" />
    } @else {
      <div class="client-detail__placeholder">
        <svg lucideUsers [size]="40" />
        <p>{{ 'client.selectPrompt' | t }}</p>
      </div>
    }
  </section>

  <app-confirm-dialog
    [visible]="pendingRemoveId() !== null"
    (confirmed)="onRemoveConfirm()"
    (cancelled)="pendingRemoveId.set(null)" />
</div>
