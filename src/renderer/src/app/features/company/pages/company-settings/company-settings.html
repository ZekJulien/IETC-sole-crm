<section class="company-page">
  <app-settings-header [icon]="headerIcon" title="company.title" subtitle="company.subtitle">
    <app-button actions [variant]="ButtonVariant.GHOST" (clicked)="companyForm.reset()">
      {{ 'common.cancel' | t }}
    </app-button>
    <app-button actions [variant]="ButtonVariant.PRIMARY" [loading]="store.saving()" (clicked)="companyForm.submit()">
      {{ 'common.save' | t }}
    </app-button>
  </app-settings-header>

  <div class="company-page__content">
    <app-company-form
      #companyForm
      [company]="store.company()"
      [showCounters]="store.isConfigured()"
      (submitted)="onSubmit($event)"
      (resetInvoice)="store.resetInvoiceCounter($event)"
      (resetQuote)="store.resetQuoteCounter($event)" />

    @if (store.isConfigured()) {
      <section class="danger-zone">
        <div class="danger-zone__info">
          <h3 class="danger-zone__title">{{ 'settings.reset.zone' | t }}</h3>
          <p class="danger-zone__text">{{ 'settings.reset.hint' | t }}</p>
        </div>
        <app-button [variant]="ButtonVariant.DANGER" (clicked)="resetConfirmOpen.set(true)">
          {{ 'settings.reset.action' | t }}
        </app-button>
      </section>
    }
  </div>

  <app-confirm-dialog
    [visible]="resetConfirmOpen()"
    title="settings.reset.title"
    message="settings.reset.message"
    (confirmed)="confirmReset()"
    (cancelled)="resetConfirmOpen.set(false)" />
</section>
