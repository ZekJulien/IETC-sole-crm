<div class="ping-container">
  <h1 class="ping-title">🏓 Ping Boilerplate</h1>
  <p class="ping-subtitle">Electron Forge + Angular + Prisma + SQLite</p>

  <div class="ping-form">
    <input
      #msgInput
      type="text"
      placeholder="Message..."
      (keydown.enter)="send(msgInput.value); msgInput.value = ''"
    />
    <button (click)="send(msgInput.value); msgInput.value = ''">Ping</button>
  </div>

  <ul class="ping-list">
    @for (ping of pings(); track ping.id) {
      <li class="ping-item">
        <span class="ping-message">{{ ping.message }}</span>
        <span class="ping-date">{{ ping.createdAt | date:'short' }}</span>
      </li>
    } @empty {
      <li class="ping-empty">Envoyez votre premier ping !</li>
    }
  </ul>
</div>
