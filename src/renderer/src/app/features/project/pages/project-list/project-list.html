<section class="projects-page">
  <header class="projects-page__header">
    <div class="projects-page__heading">
      <h1 class="projects-page__title">{{ 'project.title' | t }}</h1>
      <p class="projects-page__subtitle">{{ 'project.subtitle' | t }}</p>
    </div>
    <app-button [variant]="ButtonVariant.PRIMARY" (clicked)="openCreate()">
      <svg lucidePlus [size]="15" />
      {{ 'project.new' | t }}
    </app-button>
  </header>

  <div class="projects-page__content">
    <div class="projects-page__filters">
      <app-search-bar
        class="projects-page__search"
        [placeholder]="'project.searchPlaceholder' | t"
        (search)="onSearch($event)" />

      <select class="filter-select" (change)="onStatusChange($any($event.target).value)">
        <option value="">{{ 'project.filter.allStatuses' | t }}</option>
        @for (s of statuses; track s) {
          <option [value]="s">{{ statusKey(s) | t }}</option>
        }
      </select>

      <select class="filter-select" (change)="onClientChange($any($event.target).value)">
        <option value="">{{ 'project.filter.allClients' | t }}</option>
        @for (c of clients.clients(); track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
        }
      </select>

      <select class="filter-select" (change)="onCategoryChange($any($event.target).value)">
        <option value="">{{ 'project.filter.allCategories' | t }}</option>
        @for (cat of categories.categories(); track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </div>

    <div class="projects-page__table">
      <app-data-table
        [columns]="columns"
        [data]="rows()"
        [loading]="store.loading()"
        (rowClick)="onRowClick($event)" />
    </div>
  </div>
</section>
