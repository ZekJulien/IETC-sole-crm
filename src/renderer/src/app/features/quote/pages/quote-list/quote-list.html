<section class="quotes-page">
  <header class="quotes-page__header">
    <div class="quotes-page__heading">
      <h1 class="quotes-page__title">{{ 'quote.title' | t }}</h1>
      <p class="quotes-page__subtitle">{{ 'quote.subtitle' | t }}</p>
    </div>
    <app-button [variant]="ButtonVariant.PRIMARY" (clicked)="openCreate()">
      <svg lucidePlus [size]="15" />
      {{ 'quote.new' | t }}
    </app-button>
  </header>

  <div class="quotes-page__pipeline">
    <button
      type="button"
      class="pipe-chip"
      [class.pipe-chip--on]="statusFilter() === ''"
      (click)="selectStatus('')">
      <span class="pipe-chip__label">{{ 'quote.filter.allStatuses' | t }}</span>
      <span class="pipe-chip__count">{{ totalCount() }}</span>
    </button>
    @for (s of statuses; track s) {
      <button
        type="button"
        class="pipe-chip"
        [class.pipe-chip--on]="statusFilter() === s"
        [attr.data-status]="s"
        (click)="selectStatus(s)">
        <span class="pipe-chip__label">{{ statusKey(s) | t }}</span>
        <span class="pipe-chip__count">{{ count(s) }}</span>
      </button>
    }
  </div>

  <div class="quotes-page__content">
    <div class="quotes-page__filters">
      <app-search-bar
        class="quotes-page__search"
        [placeholder]="'quote.searchPlaceholder' | t"
        (search)="onSearch($event)" />

      <select class="filter-select" (change)="onClientChange($any($event.target).value)">
        <option value="">{{ 'quote.filter.allClients' | t }}</option>
        @for (c of clients.clients(); track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>

    <div class="quotes-page__table">
      <app-data-table
        [columns]="columns"
        [data]="rows()"
        [loading]="store.loading()"
        (rowClick)="onRowClick($event)" />
    </div>
  </div>
</section>
