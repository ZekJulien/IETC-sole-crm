<section class="quotes-page">
  <app-page-header [icon]="headerIcon" title="quote.title" subtitle="quote.subtitle">
    <app-button [variant]="ButtonVariant.PRIMARY" (clicked)="openCreate()">
      <svg lucidePlus [size]="15" />
      {{ 'quote.new' | t }}
    </app-button>
  </app-page-header>

  <app-pipeline-header
    [statuses]="statuses"
    [counts]="store.counts()"
    [selected]="statusFilter()"
    statusPrefix="quote.status."
    allLabelKey="quote.filter.allStatuses"
    (select)="selectStatus($event)" />

  <div class="quotes-page__content">
    <div class="quotes-page__filters">
      <app-search-bar
        class="quotes-page__search"
        [placeholder]="'quote.searchPlaceholder' | t"
        (search)="onSearch($event)" />

      <select class="app-select app-select--filter" (change)="onClientChange($any($event.target).value)">
        <option value="">{{ 'quote.filter.allClients' | t }}</option>
        @for (c of clients.clients(); track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
        }
      </select>
    </div>

    <div class="quotes-page__table">
      <app-data-table
        [columns]="columns"
        [data]="rows()"
        [loading]="store.loading()"
        (rowClick)="onRowClick($event)" />
    </div>
  </div>
</section>
