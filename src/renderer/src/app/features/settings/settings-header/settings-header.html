<header class="settings-header">
  <div class="settings-header__heading">
    <span class="settings-header__icon"><ng-container [ngComponentOutlet]="icon()" /></span>
    <div>
      <h2 class="settings-header__title">{{ title() | t }}</h2>
      @if (subtitle()) {
        <p class="settings-header__subtitle">{{ subtitle() | t }}</p>
      }
    </div>
  </div>

  <div class="settings-header__actions">
    <ng-content select="[actions]" />
  </div>
</header>
