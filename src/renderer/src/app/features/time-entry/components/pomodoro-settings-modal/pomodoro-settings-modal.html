<app-modal [open]="open()" [title]="'time.pomo.settings.title'" [width]="'400px'" (closed)="cancelled.emit()">
  <form class="pomo-settings" [formGroup]="form" (ngSubmit)="submit()">
    <label class="pomo-settings__field">
      <span class="pomo-settings__label">{{ 'time.pomo.settings.work' | t }}</span>
      <input class="pomo-settings__input" type="number" min="1" max="180" formControlName="workMinutes" />
    </label>
    <label class="pomo-settings__field">
      <span class="pomo-settings__label">{{ 'time.pomo.settings.shortBreak' | t }}</span>
      <input class="pomo-settings__input" type="number" min="1" max="60" formControlName="shortBreakMinutes" />
    </label>
    <label class="pomo-settings__field">
      <span class="pomo-settings__label">{{ 'time.pomo.settings.longBreak' | t }}</span>
      <input class="pomo-settings__input" type="number" min="1" max="120" formControlName="longBreakMinutes" />
    </label>
    <label class="pomo-settings__field">
      <span class="pomo-settings__label">{{ 'time.pomo.settings.interval' | t }}</span>
      <input class="pomo-settings__input" type="number" min="2" max="12" formControlName="longBreakInterval" />
    </label>
    <p class="pomo-settings__hint">{{ 'time.pomo.settings.hint' | t }}</p>
  </form>

  <div modal-actions class="pomo-settings__actions">
    <app-button [variant]="ButtonVariant.GHOST" (clicked)="cancelled.emit()">{{ 'common.cancel' | t }}</app-button>
    <app-button [variant]="ButtonVariant.PRIMARY" [loading]="saving()" (clicked)="submit()">{{ 'common.save' | t }}</app-button>
  </div>
</app-modal>
