<app-modal [open]="open()" [title]="titleKey()" (closed)="cancelled.emit()">
  <form class="vat-form" [formGroup]="form" (ngSubmit)="submit()">
    <app-form-field
      [label]="'vatRate.label' | t"
      [control]="labelControl"
      [placeholder]="'vatRate.labelPlaceholder' | t" />

    <div class="field">
      <label class="field__label">{{ 'vatRate.rate' | t }}</label>
      <div class="input-affix">
        <input class="field__input" type="number" min="0" max="100" step="0.1" formControlName="rate" />
        <span class="input-affix__unit">%</span>
      </div>
    </div>

    <div class="toggle-row">
      <div class="toggle-row__text">
        <span class="field__label">{{ 'vatRate.isDefault' | t }}</span>
        <p class="toggle-row__hint">{{ 'vatRate.isDefaultHint' | t }}</p>
      </div>
      <app-switch [checked]="isDefault" (toggled)="toggleDefault()" />
    </div>
  </form>

  <div modal-actions class="vat-actions" [class.vat-actions--edit]="isEdit()">
    @if (isEdit()) {
      <app-button [variant]="ButtonVariant.DANGER" (clicked)="deleted.emit()">
        {{ 'common.delete' | t }}
      </app-button>
    }
    <app-button [variant]="ButtonVariant.GHOST" (clicked)="cancelled.emit()">
      {{ 'common.cancel' | t }}
    </app-button>
    <app-button [variant]="ButtonVariant.PRIMARY" [loading]="saving()" (clicked)="submit()">
      {{ 'common.save' | t }}
    </app-button>
  </div>
</app-modal>
