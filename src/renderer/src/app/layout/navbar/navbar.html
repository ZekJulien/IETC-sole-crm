<header class="navbar">
  <a class="navbar__brand" [routerLink]="'/'">
    <span class="navbar__brand-mark">S</span>
    <span class="navbar__brand-text">Sole</span>
  </a>

  <nav class="navbar__nav" aria-label="Navigation principale">
    @for (item of navItems; track item.route) {
      <a
        class="nav-pill"
        [routerLink]="item.route"
        routerLinkActive="nav-pill--active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
        <ng-container [ngComponentOutlet]="item.icon" />
        <span class="nav-pill__label">{{ item.labelKey | t }}</span>
      </a>
    }

    @for (group of groups; track group.labelKey) {
      <div class="nav-group" [class.nav-group--active]="activeGroup() === group.labelKey" [class.nav-group--open]="openMenu() === group.labelKey">
        <button
          type="button"
          class="nav-pill nav-pill--group"
          [attr.aria-expanded]="openMenu() === group.labelKey"
          (click)="toggleMenu(group.labelKey, $event)">
          <ng-container [ngComponentOutlet]="group.icon" />
          <span class="nav-pill__label">{{ group.labelKey | t }}</span>
          <svg lucideChevronDown [size]="14" class="nav-pill__caret" />
        </button>
        <div class="nav-group__menu">
          @for (child of group.children; track child.route) {
            <a
              class="nav-group__item"
              [routerLink]="child.route"
              routerLinkActive="nav-group__item--active"
              (click)="closeMenu()">
              <ng-container [ngComponentOutlet]="child.icon" />
              <span>{{ child.labelKey | t }}</span>
            </a>
          }
        </div>
      </div>
    }
  </nav>

  <div class="navbar__actions">
    <app-pomodoro-indicator />
    <a
      class="navbar__icon-btn"
      [routerLink]="settingsRoute"
      routerLinkActive="navbar__icon-btn--active"
      [attr.aria-label]="'nav.settings' | t">
      <svg lucideSettings [size]="16" />
    </a>
  </div>
</header>
