<div class="chart">
  @if (isEmpty()) {
    <p class="chart__empty">{{ emptyLabel() }}</p>
  } @else {
    <svg class="chart__svg" [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" role="img">
      <g class="chart__grid">
        @for (g of gridlines(); track g.y) {
          <line [attr.x1]="ML" [attr.y1]="g.y" [attr.x2]="VIEW_W - MR" [attr.y2]="g.y" />
          <text class="chart__ytick" [attr.x]="ML - 8" [attr.y]="g.y + 3.5" text-anchor="end">{{ g.label }}</text>
        }
      </g>
      <g>
        @for (b of bars(); track $index) {
          <rect class="chart__bar" [attr.x]="b.x" [attr.y]="b.y" [attr.width]="b.w" [attr.height]="b.h" rx="2" [style.fill]="b.color">
            <title>{{ b.title }}</title>
          </rect>
        }
      </g>
      <g>
        @for (l of xLabels(); track l.x) {
          <text class="chart__xtick" [attr.x]="l.x" [attr.y]="VIEW_H - 10" text-anchor="middle">{{ l.text }}</text>
        }
      </g>
    </svg>
    <div class="chart__legend">
      @for (s of series(); track s.label) {
        <span class="chart__legend-item"><i [style.background]="s.color"></i>{{ s.label }}</span>
      }
    </div>
  }
</div>
