<span class="th__label">{{ column().labelKey | t }}</span>
@if (column().sortable) {
  <span class="th__icon">
    @if      (dir() === 'asc')  { <svg lucideArrowUp   [size]="11" /> }
    @else if (dir() === 'desc') { <svg lucideArrowDown [size]="11" /> }
    @else                       { <svg lucideChevronsUpDown [size]="11" /> }
  </span>
}
@if (resizable()) {
  <span class="th__resize" (pointerdown)="onResizeStart($event)" (click)="$event.stopPropagation()" aria-hidden="true"></span>
}
