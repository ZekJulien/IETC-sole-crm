<header class="page-header">
  <div class="page-header__heading">
    @if (icon()) {
      <span class="page-header__icon"><ng-container [ngComponentOutlet]="icon()" /></span>
    }
    <div class="page-header__text">
      <h2 class="page-header__title">{{ title() | t }}</h2>
      @if (subtitle()) {
        <p class="page-header__subtitle">{{ subtitle() | t }}</p>
      }
    </div>
  </div>
  <div class="page-header__actions">
    <ng-content />
  </div>
</header>
